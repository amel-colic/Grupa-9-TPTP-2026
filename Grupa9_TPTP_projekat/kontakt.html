<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Koristen AI za poboljsanje responzivnosti stranice na mobilnim uredjajima-->
    <title>Kontaktirajte nas | BiH Navigator</title>
    <link rel="stylesheet" href="css/tptpstil.css">
</head>
<body>

    <header>
        <h1>BiH Navigator</h1>
        <nav>
            <ul>
                <li><a href="index.html">Početna</a></li>
                <li><a href="sadrzaj.html">Detalji</a></li>
                <li><a href="kontakt.html">Kontakt</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="kontakt">
            <h2>Pošaljite nam pitanja</h2>
            <p>Sva polja je obavezzno ispuniti. Naš tim će vam odgovoriti putem emaila.</p>

            <form id="kontaktForma" novalidate>
    <div class="unos">
        <label for="ime">Ime:</label>
        <input type="text" id="ime" name="ime">
        <span id="imeGreska" class="greska-tekst"></span>
    </div>

    <div class="unos">
        <label for="prezime">Prezime:</label>
        <input type="text" id="prezime" name="prezime">
        <span id="prezimeGreska" class="greska-tekst"></span>
    </div>

    <div class="unos">
        <label for="korisnikEmail">Email adresa:</label>
        <input type="email" id="korisnikEmail" name="korisnikEmail">
        <span id="emailGreska" class="greska-tekst"></span>
    </div>

    <div class="unos">
        <label for="telefon">Broj telefona:</label>
        <input type="text" id="telefon" name="telefon">
        <span id="telGreska" class="greska-tekst"></span>
    </div>

    <div class="unos">
        <label for="tema">Šta vas zanima?</label>
        <select id="tema">
            <option value="">-- Odaberite temu --</option>
            <option value="izlet">Jednodnevni izlet</option>
            <option value="vikend">Vikend avantura</option>
            <option value="smjestaj">Upit za smještaj</option>
        </select>
        <span id="temaGreska" class="greska-tekst"></span>
    </div>

    <div class="unos">
        <label for="poruka">Vaša poruka:</label>
        <textarea id="poruka" rows="6"></textarea>
        <span id="porukaGreska" class="greska-tekst"></span>
    </div>

    <div class="akcije">
        <button type="submit">Pošalji poruku</button>
        <button type="reset" id="ponistiSve">Očisti formu</button>
    </div>
</form>

<div id="uspjeh" style="display:none;">
    <h3 id="porukaUspjehaTekst"></h3>
</div>

            <div id="uspjeh" style="display:none;">
                <h3>Hvala vam! Vaša poruka je uspješno poslana.</h3>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Autori projekta: Amel Čolić, Adis Suljić, Almedin Rabić | FET Tuzla</p>
    </footer>

    <script src="js/tptpskripte.js"></script>

</body>
</html>
